[workspace]
authors = ["DanielChahine004 <daniel.chahine004@gmail.com>"]
channels = ["conda-forge"]
name = "paper-notes"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

# The notes PDF: biber (tools/biber; fetched on Linux by tools/get-biber.sh) for
# the bibliography, and -Z search-path=src/shared for units.tex and
# references.bib, the copies of the thesis's and thesis-papers' own.

# --- Windows ---
[target.win-64.tasks.build]
cmd = "mkdir -p build && tectonic --synctex -Z search-path=src/shared --outdir build src/paper-notes/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber;$PATH" }

# commit local work, pull --rebase, refresh the bibliography from
# thesis-papers, push
[target.win-64.tasks.sync]
cmd = "powershell -NoProfile -ExecutionPolicy Bypass -File tools/sync.ps1"

# --- Linux ---
[target.linux-64.tasks.get-biber]
cmd = "bash tools/get-biber.sh"

[target.linux-64.tasks.build]
cmd = "mkdir -p build && tectonic --synctex -Z search-path=src/shared --outdir build src/paper-notes/main.tex"
env = { PATH = "$PIXI_PROJECT_ROOT/tools/biber:$PATH" }
depends-on = ["get-biber"]

[target.linux-64.tasks.sync]
cmd = "bash tools/sync.sh"

# --- both ---
# the paper notes as a live board or world map (tools/notesmap, configured by
# notesmap.toml); uv, a dependency below, builds the tool's environment from
# its pyproject on first run. The board follows edits to the notes in place.
[tasks.notes-map]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap notesmap serve --map"

[tasks.notes-canvas]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap notesmap serve"

# lint the notes: missing images, dangling \refs, programmes without \location
[tasks.notes-check]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap notesmap check"

# the notes as a live shared editor: JupyterLab with real-time collaboration, so
# several people type in one file at once and the map follows. It serves only
# src/paper-notes, and the frame-ancestors header lets the map embed it.
# NOTES_EDIT_TOKEN is the password (default: change-me). A pixi task env would
# override one set in the shell, so it is left to the config file's default.
[tasks.notes-edit]
cmd = "uv run --quiet --python 3.12 --with jupyterlab --with jupyter-collaboration --no-project jupyter lab --config=tools/jupyter-notes-config.py"


# the whole shared setup in one command: map, editor, and a public link for each
# through danvas's tunnel keepers, which hold their addresses across restarts
[tasks.notes-lab]
cmd = "uv run --quiet --python 3.12 --project tools/notesmap --with pycloudflared python tools/notes-lab.py"

# the paper PDFs, one per bibliography key, in papers/: a git-ignored clone of
# the private thesis-papers repo (tools/papers.py has the details)
[tasks.papers-pull]
cmd = "uv run --quiet --python 3.12 --no-project python tools/papers.py pull"

[tasks.papers-push]
cmd = "uv run --quiet --python 3.12 --no-project python tools/papers.py push"

[tasks.papers-status]
cmd = "uv tool run --quiet --python 3.12 --from git+https://github.com/DanielChahine004/paperstore paperstore --store papers check"

# the paperstore CLI on papers/, e.g. pixi run papers search "CTR of [0-9]+ ps"
[tasks.papers]
cmd = "uv tool run --quiet --python 3.12 --from git+https://github.com/DanielChahine004/paperstore paperstore --store papers"

[tasks.papers-fetch]
cmd = "uv run --quiet --python 3.12 --no-project python tools/papers.py fetch"


[dependencies]
tectonic = ">=0.16.9,<0.17"
uv = ">=0.12.13,<0.13"
