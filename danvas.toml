# The paper-notes map as a link, built in the reader's browser by danvas's
# static page from this repository (no server):
#   https://danielchahine004.github.io/danvas/?repo=DanielChahine004/paper-notes
# It redraws within a minute of a push. The board is what notes-map shows, with
# [publish] applied; the editor link is dropped (it points at this machine).
[app]
entry = "notesmap.static:app"
requires = ["github:DanielChahine004/notesmap@main"]   # pin a tag or commit to hold a version
files = ["notesmap.toml"]                              # notesmap.static reads the rest from it
# the figures are shown at most a panel wide (560 px): shrink bigger ones as
# they are fetched, which keeps the map within a phone's memory
max_image = 600

# Figures cut from the papers (paperstore box annotations) stay in the private
# thesis-papers repo. A reader who can read it (signed in, a collaborator) sees
# them on the map; anyone else gets each figure's label and link without the
# picture. \claimfig{Key/id} in the notes shows one (notesmap.toml [claims]).
[[app.mount]]
repo = "DanielChahine004/thesis-papers"
files = ["figures/"]
at = "src/paper-notes/remote/thesis-papers"
