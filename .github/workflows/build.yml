# Lint the paper notes, and build their PDF so a current copy is downloadable
# from anywhere without a local toolchain. Both jobs install the environment
# from pixi.lock (`frozen: true` installs it as written, never re-solving).

name: notes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint the notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          frozen: true
          cache: true

      # --strict fails on a defect in the notes -- a missing image, a \ref to a
      # key nothing defines, a programme with no \location, a conference with
      # no \dates, a key used twice, a \doi that reaches no references.bib
      # entry. --gaps additionally lists unfinished notes, which print as
      # `note:` and never fail the run.
      - name: notesmap check
        run: pixi run notes-check --gaps --strict

  pdf:
    name: build the notes PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          frozen: true
          cache: true

      - name: cache the Tectonic bundle
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('pixi.lock') }}
          restore-keys: tectonic-

      - name: cache biber
        uses: actions/cache@v6
        with:
          path: tools/biber
          key: biber-${{ hashFiles('tools/get-biber.sh') }}

      - name: build
        run: pixi run build

      - uses: actions/upload-artifact@v7
        with:
          name: paper-notes-${{ github.sha }}
          path: build/main.pdf
          if-no-files-found: error
          retention-days: 90
